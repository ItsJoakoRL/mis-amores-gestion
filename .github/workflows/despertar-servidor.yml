# Visita el servidor de internet (Render) cada 5 minutos para que no se duerma
# aunque todas las PCs del negocio estén apagadas. Es la capa de afuera: el
# propio servidor también se visita solo (electron/despertador.ts), pero un
# servidor dormido no puede despertarse a sí mismo; esto sí.
#
# No marca error si el servidor no contesta, a propósito: GitHub mandaría un
# mail por cada intento. Si algo anda mal se ve en la pestaña Actions.
name: Despertar el servidor de internet

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar mis-amores.onrender.com
        run: |
          # Si estaba dormido tarda hasta un minuto en contestar: se espera.
          curl --silent --show-error --fail --max-time 100 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               https://mis-amores.onrender.com/api/sistema/info \
            && echo \
            || echo "El servidor no contestó en este intento."
